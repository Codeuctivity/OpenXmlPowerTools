# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
    rebase-strategy: auto

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    rebase-strategy: auto

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    rebase-strategy: auto

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    # SkiaSharp and its native assets must always have the same version - separate PRs each fail
    # the build until the other one is merged, so update them together in one PR. SkiaSharpCompare
    # (test dependency) is built against a specific SkiaSharp version and joins the same PR.
    groups:
      skiasharp:
        patterns:
          - "SkiaSharp"
          - "SkiaSharp.*"
          - "Codeuctivity.SkiaSharpCompare"
    # Wait a few days before picking up a new SkiaSharp, so SkiaSharpCompare has time to publish a
    # release built against it and both land in the same grouped PR.
    cooldown:
      default-days: 3
      include:
        - "SkiaSharp"
        - "SkiaSharp.*"
    ignore:
      - dependency-name: "SixLabors.ImageSharp"
        versions: ["3.x", "4.x"]
      - dependency-name: "coverlet.collector"
      - dependency-name: "Codeuctivity.HtmlRenderer"
      - dependency-name: "nunit"
      - dependency-name: "SonarAnalyzer.CSharp"
      - dependency-name: "AngleSharp"
      - dependency-name: "Microsoft.NET.Test.Sdk"
      - dependency-name: "Microsoft.AspNetCore.Mvc.Testing"
      - dependency-name: "Moq"
      - dependency-name: "xunit"
      - dependency-name: "xunit.runner.visualstudio"
      - dependency-name: "MSTest.TestAdapter"
      - dependency-name: "MSTest.TestFramework"
      - dependency-name: "Codeuctivity.ImageSharpCompare"
      - dependency-name: "NUnit3TestAdapter"
      - dependency-name: "xunit.runner.console"